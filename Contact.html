<!DOCTYPE html>
<html>

    <title> Travel Guide Form</title>

<style>
    body{
        background-image: url(https://i.pinimg.com/736x/81/22/e1/8122e1f4b264c978df765e1875d05b6c.jpg);
        background-size: 95%;
    }

    .container{
        max-width: 450px;
        margin: auto;
        background-color: rgb(197, 174, 172);
        padding: 30px;
        border-radius: 15px;
        box-shadow: inset;
        background-image: url(https://i.pinimg.com/736x/86/55/c3/8655c33f832e21be0e7e7cfa04648ca8.jpg);
    }

    h1{ 
        text-align: center;
        color: rgb(107, 1, 1);
        margin-bottom: auto;
    }

    button{
        width: 40%;
        padding: 3%;
        background-color: rgb(104, 49, 49);
        color: ghostwhite;
        border-radius: 8%;
        font-size: medium;
        cursor: pointer;
    }

    button:hover{
        background-color: rgb(6, 8, 121);
    }

</style>
<body>

<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="e2841ae1-8216-4911-87ff-15f32fcb9edd">

<div class="container">
    <h1> Registration Form To Travel </h1>
</div>


<br>
<hr>

<div class="container"> 
    <label for="FULL NAME"> FULL NAME: </label>
        <input type="text" id="FULL NAME" placeholder="Enter your name:" required>

        
<br>



    <br> 
    <label for="Email"> EMAIL: </label>
        <input type="text" id="EMAIL" placeholder="Enter your email:" required>

<br>

    <br> 
    <label for="password"> PASSWORD: </label>
        <input type="text" id="password" placeholder="Type a password:" >


<br>
   


<br>

<br>

    <div class="form-group1">
     
  <br>
    <label for="Gender"> GENDER: </label>
      
    <br> <input type="radio" name="Gender" value="Male">
        <label> Male </label>

        <input type="radio" name="Gender" value="Female">
        <label> Female </label>
    </div>


<br>

  <br>
    <label for="Place Guide"> Place to Guide: </label>
      
    <br> <input type="checkbox" name="Place to Guide" value="Banaue Rice Terraces">
        <label> Banaue Rice Terraces </label>

    <br>

    <br> <input type="checkbox" name="Place to Guide" value="Puerto Princesa">
        <label> Puerto Princesa </label>

    <br>

    <br> <input type="checkbox" name="Place to Guide" value="Aklan, Boracay">
        <label> Aklan, Boracay </label>

    <br>

    <br> <input type="checkbox" name="Place to Guide" value="Intramuros">
        <label> Intramuros </label>

        
    <br>
    <h1> Travel Guide Time:</h1>
        <input type="checkbox" name="Travel Guide Time" value="5am-8am">
        <label> 5am-8am </label>

        <input type="checkbox" name="Travel Guide Time" value="10am-1pm">
        <label> 10am-1pm </label>

        <input type="checkbox" name="Travel Guide Time" value="2pm-5pm">
        <label> 2pm-5pm </label>

        <input type="checkbox" name="Travel Guide Time" value="6pm-9pm">
        <label> 6pm-9pm </label>


    <br> 
    <br>
    <label for="message"> OTHER: </label>
        <textarea type="text" id="message" placeholder="Message:" > </textarea>


    <center>
        <br>
            <button type="submit" name="submit"> Register Now </button>
        <br>
            <button type="reset" name="reset"> Clear Form </button>\

        <br>
        <h3> Contact Us!</h3>
        <p> rajyajabonet@gmail.com</p>
    </center>



</div>
</form>
</body>
</html>
